name: Mobile CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-bundle:
    name: Tests + iOS and Android bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # This gate generates bundles only; it never publishes an OTA update,
      # creates a signed store build, or uses an Expo account token.
      EXPO_PUBLIC_API_URL: https://hr-dock-backend-staging.up.railway.app/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and interaction tests
        run: npm test -- --ci
      - name: Export both platform bundles
        run: npx expo export --platform ios --platform android --output-dir dist-ci
