name: App API smoke
on:
  pull_request:
    branches: [master]
    paths:
      - scripts/check-app-api.mjs
      - .github/workflows/app-api-smoke.yml
permissions:
  contents: read
jobs:
  app-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check app API without credentials or business writes
        run: node scripts/check-app-api.mjs
